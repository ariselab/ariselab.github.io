name: "Add a reading group paper"
description: "Add a paper to the reading group list"
labels: ["reading"]
body:
  - type: input
    id: presenter
    attributes:
      label: First name
      placeholder: "Magnus"
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper title
      placeholder: "Training a Misaligned Reward Seeker"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: "https://arxiv.org/abs/..."
    validations:
      required: true
